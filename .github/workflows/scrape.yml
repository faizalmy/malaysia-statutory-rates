name: Scrape & Publish

on:
  schedule:
    - cron: "0 2 * * 1"  # Every Monday 2am UTC (10am MYT)
  workflow_dispatch:      # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scraper]"

      - name: Run scrapers
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          malaysia-statutory-rates scrape --all
          malaysia-statutory-rates status

      - name: Check for data changes
        id: diff
        run: |
          git diff --quiet malaysia_statutory_rates/data/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        run: |
          CURRENT=$(python -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          sed -i "s/version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \"$CURRENT\"/__version__ = \"$NEW_VERSION\"/" malaysia_statutory_rates/__init__.py
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: update statutory rates (auto-scraped)"
          title: "data: update statutory rates ${{ steps.diff.outputs.version }}"
          body: |
            Automated data update from scheduled scraper run.

            ## Changes
            - Data files updated in `malaysia_statutory_rates/data/`
            - Version bumped to `${{ steps.diff.outputs.version }}`
            - Changelog entries appended to `data/_changelog.jsonl`

            ## Checklist
            - [ ] Review data diffs below
            - [ ] Run `malaysia-statutory-rates changelog --last 10` to see changes
            - [ ] Run `malaysia-statutory-rates status` to verify freshness
            - [ ] Merge to trigger PyPI publish
          branch: auto/data-update
          delete-branch: true

  publish:
    needs: scrape
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
